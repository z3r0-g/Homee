<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homee AI Agent Platform</title>
    <link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
</head>
<body>

    <div class="topbar">
        <div class="header-logo">
            Homee AI Agent Platform
        </div>
        <div class="header-actions">
            <span class="header-status" id="llmStatusPill" title="Open Settings">Checking LLM…</span>
            <span class="header-status" id="mcpStatusPill" title="Open Settings">Checking MCP…</span>
        </div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Bots</h2>
            </div>
            <div class="sidebar-search">
                <input type="text" id="chatSearchInput" placeholder="Search chats…" aria-label="Search chats">
                <div id="chatSearchResults"></div>
            </div>
            <div class="sidebar-content" id="botList"></div>
            <div class="sidebar-footer">
                <button class="btn-new-bot" id="newBotBtn">+ New Bot</button>
                <button class="btn-secondary" id="settingsBtn">Settings</button>
            </div>
        </aside>

        <main class="chat-area">
            <div class="chat-header">
                <div class="chat-title">Agent Console</div>
                <div class="chat-status status-pill">Ready</div>
            </div>
            <div id="llmBanner" class="llm-banner" style="display:none;" aria-live="polite"></div>
            <div id="chatArea" class="chat-host">
                <div class="empty">Select a bot to begin</div>
            </div>
        </main>
    </div>

    <input type="file" id="fileAttachInput" accept="text/*,.txt,.md,.json,.csv,.log,.py,.js,.ts,.html,.css,.xml,.yaml,.yml,.toml,.ini,.cfg" style="display:none">

    <!-- CREATE BOT MODAL -->
    <div id="newBotModal" class="modal" role="dialog" aria-modal="true" aria-label="Create new bot">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Bot</h3>
                <span class="close-modal" aria-label="Close">&times;</span>
            </div>
            <form id="newBotForm">
                <div class="form-group">
                    <label>Bot Name</label>
                    <input type="text" id="newBotName" placeholder="Research Bot" required>
                </div>
                <div class="form-group">
                    <label>Skill</label>
                    <select id="newBotSkill">
                        <option value="">(none)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Task Prompt</label>
                    <textarea id="newBotTaskPrompt" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Schedule</label>
                    <select id="newBotSchedule">
                        <option value="none">None</option>
                        <option value="interval">Every N Seconds</option>
                    </select>
                </div>
                <div class="form-group" id="scheduleOptions" style="display:none;">
                    <label>Interval</label>
                    <input type="number" id="newBotInterval" value="3600" min="60">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="newBotEnabled" checked>
                        Enabled
                    </label>
                </div>
                <button type="submit" class="btn-save">Create Bot</button>
            </form>
        </div>
    </div>

    <!-- EDIT BOT MODAL -->
    <div id="editBotModal" class="modal" role="dialog" aria-modal="true" aria-label="Edit bot">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Bot</h3>
                <span class="close-modal" aria-label="Close">&times;</span>
            </div>
            <form id="editBotForm">
                <input type="hidden" id="editBotId">
                <div class="form-group">
                    <label>Bot Name</label>
                    <input type="text" id="editBotName" required>
                </div>
                <div class="form-group">
                    <label>Skill</label>
                    <select id="editBotSkill">
                        <option value="">(none)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Task Prompt</label>
                    <textarea id="editBotTaskPrompt" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Schedule</label>
                    <select id="editBotSchedule">
                        <option value="none">None</option>
                        <option value="interval">Every N Seconds</option>
                        <option value="cron">Cron Expression</option>
                    </select>
                </div>
                <div class="form-group" id="editScheduleOptions" style="display:none;">
                    <label>Interval</label>
                    <input type="number" id="editBotInterval" value="3600" min="60">
                </div>
                <div class="form-group" id="editCronOptions" style="display:none;">
                    <label>Cron Expression</label>
                    <input type="text" id="editBotCron" placeholder="0 * * * *">
                </div>
                <p id="editBotStatus" class="llm-status" role="status"></p>
                <button type="submit" class="btn-save">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- SKILL MODAL -->
    <div id="skillModal" class="modal" role="dialog" aria-modal="true" aria-label="Create or edit skill">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Skill</h3>
                <span class="close-modal" aria-label="Close">&times;</span>
            </div>
            <form id="skillForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="skillName" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="skillDescription"></textarea>
                </div>
                <div class="form-group">
                    <label>Skills</label>
                    <input type="text" id="skillSkills">
                </div>
                <div class="form-group">
                    <label>Abilities</label>
                    <input type="text" id="skillAbilities">
                </div>
                <div class="form-group">
                    <label>System Prompt</label>
                    <textarea id="skillSystemPrompt"></textarea>
                </div>
                <button type="submit" class="btn-save">Save Skill</button>
            </form>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Settings</h3>
                <span class="close-modal" aria-label="Close">&times;</span>
            </div>

            <!-- General settings: above the tabs, applies to all of them -->
            <div class="form-group">
                <label>Task Scheduler</label>
                <label>
                    <input type="checkbox" id="settingsSchedulerEnabled" checked>
                    Scheduler Enabled
                </label>
            </div>
            <div class="form-group">
                <label>Scheduler Tick (seconds)</label>
                <input type="number" id="settingsSchedulerTick" value="30" min="5">
            </div>
            <div class="form-group">
                <button type="submit" form="settingsForm" class="btn-save" id="settingsSaveBtn">Save Settings</button>
                <div id="settingsSaveStatus" class="llm-status" aria-live="polite"></div>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="llm">LLMs</button>
                <button class="tab-btn" data-tab="mcp">MCPs</button>
                <button class="tab-btn" data-tab="skills">Skills</button>
            </div>

            <!-- Tab Contents -->
            <div class="tab-content active" id="tab-llm">
                <form id="settingsForm">
                    <!-- LLM Mode Selector -->
                    <div class="form-group">
                        <label>LLM Mode</label>
                        <div id="modeOptions" class="mode-switches">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>

                    <hr style="margin: 16px 0; border-color: var(--color-border);">

                    <!-- Local models: collapsible, so the Cloud / Remote
                         Local section below can take focus in those modes -->
                    <div class="form-group llms-section">
                        <div class="llms-header">
                            <label style="margin: 0;">Local Models</label>
                            <button type="button" class="btn-icon" id="llmsCollapseBtn"
                                    aria-expanded="true" aria-controls="llmsBody"
                                    title="Collapse local models">&#9650;</button>
                        </div>
                        <div id="llmsBody">
                            <div id="llmStatusLine" class="llm-status">Checking Ollama…</div>
                            <div id="modelFilterChips" class="chip-row"></div>
                            <h5>Loaded on this host</h5>
                            <div id="loadedModelsGrid" class="model-grid"></div>
                            <h5>Available models</h5>
                            <div id="modelCatalogGrid" class="model-grid"></div>
                            <div id="catalogNote" class="llm-status"></div>
                            <div id="ollamaSearchLink"></div>
                            <div class="form-group" id="group-local-model">
                                <label>Primary Model</label>
                                <input type="text" id="settingsLocalModel" value="qwen2.5:7b">
                            </div>
                            <div class="form-group" id="group-secondary-model">
                                <label>Secondary Model</label>
                                <input type="text" id="settingsSecondaryModel" placeholder="e.g. qwen2.5:7b">
                                <small id="secondaryModelHint" class="llm-status"></small>
                            </div>
                        </div>
                    </div>

                    <!-- Divider + mode section (Cloud / Remote Local only;
                         hidden in Local + Local, where the slots above are
                         the whole story) -->
                    <hr id="modeSectionDivider" style="margin: 16px 0; border-color: var(--color-border);">
                    <div id="modeSection">
                        <h4 id="modeSectionTitle">Cloud</h4>
                        <p id="modeSectionHint" class="llm-status"></p>
                        <h5 id="modeSubCloud">Cloud endpoint</h5>
                        <div class="form-group" id="group-secondary-base-url">
                            <label>Secondary Base URL</label>
                            <input type="text" id="settingsSecondaryBaseUrl" placeholder="http://localhost:11434">
                        </div>
                        <div class="form-group" id="group-secondary-api-key">
                            <label>Secondary API Key</label>
                            <input type="password" id="settingsSecondaryApiKey" autocomplete="current-password">
                        </div>
                        <h5 id="modeSubRemote">Remote fallback</h5>
                        <div class="form-group" id="group-remote-base-url">
                            <label>Remote Base URL</label>
                            <input type="text" id="settingsRemoteBaseUrl" placeholder="https://openrouter.ai/api/v1">
                        </div>
                        <div class="form-group" id="group-remote-api-key">
                            <label>Remote API Key</label>
                            <input type="password" id="settingsRemoteApiKey" autocomplete="current-password">
                        </div>
                        <div class="form-group" id="group-remote-model">
                            <label>Remote Model</label>
                            <input type="text" id="settingsRemoteModel" value="gpt-4o-mini">
                        </div>
                    </div>
                </form>
            </div>

            <div class="tab-content" id="tab-mcp">
                <!-- Add local MCP: collapsible, collapsed by default,
                     stays at top; "Use this" expands it with a prefill -->
                <div class="form-group">
                    <div class="collapse-header">
                        <label style="margin: 0;">Add local MCP</label>
                        <button type="button" class="btn-icon" id="mcpAddCollapseBtn"
                                aria-expanded="false" aria-controls="mcpAddBody"
                                title="Expand add local MCP">&#9654;</button>
                    </div>
                    <div id="mcpAddBody" style="display: none;">
                        <input type="text" id="mcpName" placeholder="Name (e.g. My API)" aria-label="MCP name">
                        <input type="text" id="mcpDescription" placeholder="Description" aria-label="MCP description">
                        <input type="text" id="mcpEndpoint" placeholder="Endpoint URL (e.g. https://api.example.com)" aria-label="MCP endpoint URL">
                        <select id="mcpMethod" aria-label="MCP method">
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                        </select>
                        <button type="button" class="btn-secondary" id="mcpAddBtn">Add MCP</button>
                        <div id="mcpAddStatus" class="llm-status"></div>
                    </div>
                </div>
                <!-- Unified grid: filter pills + search over local and
                     remote cards together, like the LLM model browser -->
                <div class="form-group">
                    <div id="mcpFilterChips" class="chip-row"></div>
                    <input type="text" id="mcpSearch" placeholder="Search MCPs…"
                           aria-label="Search MCPs">
                    <div id="mcpGrid" class="marketplace-grid"></div>
                    <div id="mcpGridNote" class="llm-status"></div>
                    <div class="llm-status">
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-skills">
                <div class="form-group">
                    <label>Remote Skills Repo (git URL)</label>
                    <div class="form-row">
                        <input type="text" id="settingsSkillsGitUrl" placeholder="https://github.com/you/my-skills.git">
                        <button type="button" class="btn-secondary" id="skillsSyncBtn">Sync Skills</button>
                    </div>
                    <div id="skillsSyncStatus" class="llm-status"></div>
                </div>
                <div class="form-group">
                    <label>Skills</label>
                    <div id="skillFilterChips" class="chip-row"></div>
                    <input type="text" id="skillSearch" placeholder="Search skills…" aria-label="Search skills">
                    <div id="skillList" class="marketplace-grid"></div>
                    <div id="skillsGridNote" class="llm-status"></div>
                </div>
                <div class="form-group">
                    <label>Skills from Environment</label>
                    <div id="skillEnvList" class="marketplace-grid"></div>
                </div>
                <div class="form-group">
                    <label>Top Skills</label>
                    <div id="leaderboardSkillsGrid" class="marketplace-grid"></div>
                    <div class="llm-status">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODEL PULL MODAL -->
    <div id="pullModal" class="modal" role="dialog" aria-modal="true" aria-label="Model pull progress">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Pulling model</h3>
                <span class="close-modal" aria-label="Close">&times;</span>
            </div>
            <p id="pullModalModel" class="llm-status"></p>
            <div id="pullModalStatus" class="llm-status" aria-live="polite"></div>
            <button type="button" class="btn-secondary" id="pullModalClose">Close</button>
        </div>
    </div>

    <script src="/static/app.js?v={{ static_version }}"></script>
</body>
</html>
